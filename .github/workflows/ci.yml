name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests, lint and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: boom_queue
          POSTGRES_PASSWORD: boom_queue_test
          POSTGRES_DB: boom_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boom_queue -d boom_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DISCORD_TOKEN: test-token-not-a-real-secret
      DISCORD_CLIENT_ID: "123456789012345678"
      DATABASE_URL: postgresql://boom_queue:boom_queue_test@localhost:5432/boom_queue_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate:deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
